services:
  - type: web
    name: traffic-accident-detection-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm test && npm run build:render
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ALLOW_UNCONFIGURED_BACKEND
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
